plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id "dagger.hilt.android.plugin"
}

android {
    namespace "com.nermeen.movie_app"
    compileSdk 34

    buildFeatures {
        dataBinding true
        viewBinding true
    }

    defaultConfig {
        applicationId "com.nermeen.movie_app"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // Lottie
    def lottieVersion = "6.3.0" // Updated to the latest version
    implementation "com.airbnb.android:lottie:$lottieVersion"

    // Shimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Room
    def room_version = "2.6.1" // Updated to the latest stable version
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // ViewModel and LiveData
    def viewModelLifeCycleVersion = '2.8.5' // Updated lifecycle components
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$viewModelLifeCycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$viewModelLifeCycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$viewModelLifeCycleVersion"

    // CardView
    def cardViewVersion = "1.0.0"
    implementation "androidx.cardview:cardview:$cardViewVersion"

    // RecyclerView
    def recyclerviewVersion = "1.3.2" // Updated RecyclerView to the latest version
    implementation "androidx.recyclerview:recyclerview:$recyclerviewVersion"

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1' // Updated Gson version
    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.11' // Updated OkHttp version

    // Retrofit Coroutines Support
    def coroutinesVersion = '1.7.3' // Updated to latest Coroutines version
    implementation "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"

    // Hilt
    def hilt_version = "2.48" // Updated Hilt version
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$hilt_version"

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0' // Updated Glide version

    // Navigation Component
    def nav_version = "2.8.0" // Updated navigation component
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation "androidx.navigation:navigation-dynamic-features-fragment:$nav_version"

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1' // Updated core-ktx version
    implementation 'androidx.appcompat:appcompat:1.7.0' // Updated AppCompat version
    implementation 'com.google.android.material:material:1.12.0' // Updated Material Components version
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Updated ConstraintLayout

    // Paging
    implementation "androidx.paging:paging-runtime-ktx:3.3.2"

    // Testing
    testImplementation 'junit:junit:4.13.2' // Updated JUnit version
    androidTestImplementation 'androidx.test.ext:junit:1.2.1' // Updated AndroidX Test JUnit
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1' // Updated Espresso version
}

kapt {
    correctErrorTypes = true
}
